name: Faithful A2 ASTRYX Consumer

on:
  workflow_run:
    workflows: ["Faithful A2 ASTRYX Producer"]
    types: [completed]

permissions: {}

jobs:
  trusted-report:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Resolve trusted workflow-run identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${HEAD_OWNER}:${HEAD_BRANCH}" --jq '.[0].number')
          test -n "$pr" && test "$pr" != "null"
          data=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          test "$(jq -r .head.sha <<<"$data")" = "$TRUSTED_HEAD_SHA"
          test "$(jq -r .head.repo.full_name <<<"$data")" = "$TRUSTED_HEAD_REPO"
          echo "head=$TRUSTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_repo=$TRUSTED_HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "base_repo=$(jq -r .base.repo.full_name <<<"$data")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: pr-analysis
          path: pr-analysis
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Cross-check artifact identity before any trusted processing
        env:
          EXPECTED_PR: ${{ steps.identity.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.identity.outputs.head }}
          EXPECTED_HEAD_REPO: ${{ steps.identity.outputs.head_repo }}
          EXPECTED_BASE_REPO: ${{ steps.identity.outputs.base_repo }}
          EXPECTED_RUN: ${{ github.event.workflow_run.id }}
          EXPECTED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          test "$(jq -r .prNumber pr-analysis/pr-meta.json)" = "$EXPECTED_PR"
          test "$(jq -r .headSha pr-analysis/pr-meta.json)" = "$EXPECTED_HEAD"
          test "$(jq -r .headRepository pr-analysis/pr-meta.json)" = "$EXPECTED_HEAD_REPO"
          test "$(jq -r .baseRepository pr-analysis/pr-meta.json)" = "$EXPECTED_BASE_REPO"
          test "$(jq -r .sourceRunId pr-analysis/pr-meta.json)" = "$EXPECTED_RUN"
          test "$(jq -r .sourceRunAttempt pr-analysis/pr-meta.json)" = "$EXPECTED_ATTEMPT"
      - name: Preserve the source property that artifact payloads are data, not commands
        run: test -f pr-analysis/payload.sh
